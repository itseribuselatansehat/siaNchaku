<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="siancakuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#siancakuGrad)" />
  <circle cx="256" cy="256" r="215" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="256" cy="256" r="165" fill="#ffffff" fill-opacity="0.05" />
  
  <g filter="url(#shadow)">
    <!-- Main check badge -->
    <path d="M160 256 L228 324 L356 196" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Notification Bell Ring at Top Right -->
    <circle cx="372" cy="140" r="42" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="8" />
    <path d="M372 125 C364 125 358 131 358 139 C358 152 352 156 348 158 H396 C392 156 386 152 386 139 C386 131 380 125 372 125 Z" fill="#ffffff" />
    <circle cx="372" cy="164" r="4" fill="#ffffff" />
    
    <!-- SiaNcaku Spark / Star at Top Left -->
    <path d="M140 130 Q140 155 115 155 Q140 155 140 180 Q140 155 165 155 Q140 155 140 130 Z" fill="url(#glowGrad)" />
    
    <!-- Clock Indicator Ring Accent -->
    <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" stroke-dasharray="16 12" />
  </g>
</svg>
